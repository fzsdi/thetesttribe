<!doctype html>
<html>
<head><meta charset="utf-8"><title>Demo Shop</title></head>
<body>
  <h1>Demo Shop</h1>
  <p>Cart: <span id="cart-count">0</span></p>
  <div id="product-list">Loading...</div>
  <button id="checkout-btn">Checkout</button>
  <p id="message"></p>
  <script>
    // Products load after a random delay (200-1500 ms). This is what makes the flaky demo flaky.
    const products = ['Notebook', 'Pen', 'Backpack'];
    let cart = 0;
    setTimeout(() => {
      const list = document.getElementById('product-list');
      list.innerHTML = '';
      products.forEach(name => {
        const div = document.createElement('div');
        div.className = 'product';
        div.innerHTML = name + ' <button>Add to cart</button>';
        div.querySelector('button').onclick = () => {
          cart++;
          document.getElementById('cart-count').textContent = cart;
        };
        list.appendChild(div);
      });
    }, 200 + Math.random() * 1300);
    document.getElementById('checkout-btn').onclick = () => {
      document.getElementById('message').textContent = cart > 0 ? 'Order placed' : 'Cart is empty';
    };
  </script>
</body>
</html>
